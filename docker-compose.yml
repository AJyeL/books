name: books

services:
  postgres:
    image: postgres:17
    container_name: books-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Collecteur : jamais lancé par « docker compose up » (profil dédié).
  # Lancement : docker compose --profile collector run --rm collector
  collector:
    build: .
    image: books-collector
    profiles: ["collector"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOOKS_ENV: ${BOOKS_ENV:-}
      # Hôte et port fixés ici, et nulle part ailleurs (ni dans .env) :
      # le collecteur joint PostgreSQL par le nom du service sur le réseau interne
      # de Compose, sur son port interne 5432 (5433 n'est publié que pour l'hôte).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Chemin vu depuis le conteneur ; le chemin sur l'hôte vient de .env (volume ci-dessous)
      BOOKS_RAW_DIR: /data/raw
    # Garde-fous si BOOKS_RAW_DIR manque dans .env :
    # - pas de ${BOOKS_RAW_DIR:?} : Compose refuserait alors TOUT le fichier,
    #   y compris le service postgres et la sauvegarde nocturne ;
    # - pas de source vide : Compose monterait le dossier du dépôt ;
    # - donc un chemin inexistant au nom explicite, et Docker ne crée jamais le dossier
    #   (il serait créé au nom de root, illisible pour l'utilisateur 1000 du conteneur).
    volumes:
      - type: bind
        source: ${BOOKS_RAW_DIR:-/BOOKS_RAW_DIR-non-defini}
        target: /data/raw
        bind:
          create_host_path: false

volumes:
  pgdata:
